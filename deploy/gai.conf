# RFC 6724 address selection policy.
# Prefer native IPv6 for dual-stack destinations while retaining IPv4 fallback.
# The deployment network can reach the 1688 IPv6 CDN, while some IPv4 CDN
# paths may stall during the TLS handshake.
label ::1/128 0
label ::/0 1
label 2002::/16 2
label ::/96 3
label ::ffff:0:0/96 4

precedence ::1/128 50
precedence ::/0 100
precedence 2002::/16 30
precedence ::/96 20
precedence ::ffff:0:0/96 10
