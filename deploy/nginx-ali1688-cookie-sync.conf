limit_req_zone $binary_remote_addr zone=ali1688_cookie_sync:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ali1688_image_search:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name sync.example.com;

    ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;

    access_log off;
    error_log /var/log/nginx/ali1688-api-error.log warn;

    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        proxy_set_header Host $host;
    }

    location = /api/cookie-sync {
        limit_except POST { deny all; }
        limit_req zone=ali1688_cookie_sync burst=3 nodelay;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8765/api/cookie-sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_read_timeout 15s;
    }

    location = /api/v1/image-search {
        limit_except POST { deny all; }
        limit_req zone=ali1688_image_search burst=10 nodelay;
        client_max_body_size 11m;

        proxy_pass http://127.0.0.1:8765/api/v1/image-search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
