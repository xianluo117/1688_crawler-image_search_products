services:
  ali1688-api:
    image: qingmiaoai/1688imagesearch:latest
    container_name: ali1688-image-search-api
    restart: unless-stopped
    environment:
      COOKIE_SYNC_SHARED_SECRET: ${COOKIE_SYNC_SHARED_SECRET:?COOKIE_SYNC_SHARED_SECRET is required}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:?COOKIE_ENCRYPTION_KEY is required}
      ALI1688_API_KEY: ${ALI1688_API_KEY:?ALI1688_API_KEY is required}
      COOKIE_SYNC_MAX_CLOCK_SKEW: ${COOKIE_SYNC_MAX_CLOCK_SKEW:-300}
      ALI1688_MAX_IMAGE_MB: ${ALI1688_MAX_IMAGE_MB:-10}
      ALI1688_COOKIE_FILE: /app/runtime/ali1688.cookies.enc
      ALI1688_UPLOAD_TEMP_DIR: /app/runtime/uploads
    ports:
      - '127.0.0.1:8765:8765'
    networks:
      - ali1688-network
    volumes:
      - ./runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ali1688-network:
    driver: bridge
    enable_ipv6: true
